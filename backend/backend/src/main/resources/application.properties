spring.application.name=conectacao-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# Configurações do PIX (Bacen BR Code)
pix.chave-central=${PIX_CHAVE_CENTRAL:61999617819}
pix.beneficiario-nome=${PIX_BENEFICIARIO_NOME:DAVI SILVA RAMOS}
pix.cidade=${PIX_CIDADE:BRASILIA}

# Integração AbacatePay (API v2)
abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.base-url=${ABACATEPAY_BASE_URL:https://api.abacatepay.com/v2}

